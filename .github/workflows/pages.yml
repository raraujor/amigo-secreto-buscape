name: Publicar no GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Testes que não precisam do emulador (as regras rodam no gate local, com Java 21).
      # A verificação manual (T015) só pode ser marcada depois que o site existe: fica fora daqui
      # e vale no gate da unit.
      - run: npx vitest run comum scripts testes/repo -t "^(?!.*verificação manual)"
      - run: npx ng build --base-href /${{ github.event.repository.name }}/
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist/site/browser
      - id: deploy
        uses: actions/deploy-pages@v4
